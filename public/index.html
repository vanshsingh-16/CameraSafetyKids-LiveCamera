<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CamSafetyKids</title><style>body{font-family:system-ui;max-width:800px;margin:auto;padding:20px}video{width:100%;background:#111;border-radius:14px}.row{display:flex;gap:8px;flex-wrap:wrap}input,button{padding:12px;border-radius:10px;border:1px solid #bbb}button{cursor:pointer}.status{padding:12px;border-radius:10px;background:#eee;margin:12px 0}.on{background:#d8ffd8}</style></head><body><h1>CamSafetyKids</h1><p>Consent-based live camera session</p><div class="row"><input id="room" placeholder="Pair code"><select id="role"><option value="child">Child device</option><option value="parent">Parent</option></select><button id="join">Join</button></div><div id="status" class="status">Not connected</div><video id="remote" autoplay playsinline controls></video><div id="childControls" hidden><button id="start">Start camera</button><button id="stop">Stop camera</button><p>🔴 <b>Camera is ON</b> · 🎙️ <b>Microphone is ON</b> — visible while streaming.</p><video id="local" autoplay muted playsinline></video></div><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
